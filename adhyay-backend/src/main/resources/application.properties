# ========================================================
# ADHYAY Backend Configuration — Walchand College of Engineering
# All secrets and external credentials parameterized via ${VAR:fallback}
# ========================================================

spring.application.name=adhyay-backend

# MongoDB Connection
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/adhyay}}
spring.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/adhyay}}

# Server Port (supports cloud PORT injection e.g. Render/Heroku/Koyeb)
server.port=${PORT:${SERVER_PORT:8081}}

# Multipart upload limits (max 500 MB video)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Cloudinary Storage Credentials
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:nsnspcyt}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Moodle Integration
moodle.base-url=${MOODLE_BASE_URL:https://adhyay-lecture-management-system.moodlecloud.com}
moodle.token=${MOODLE_TOKEN:}
moodle.service=ADHYAY Integration

# Email Dispatcher API (Resend / SMTP)
email.api.provider=${EMAIL_API_PROVIDER:resend}
email.api.key=${RESEND_API_KEY:}
email.from.address=${EMAIL_FROM_ADDRESS:onboarding@resend.dev}
email.from.name=${EMAIL_FROM_NAME:ADHYAY Walchand College}

# Groq AI API Configuration
groq.api-key=${GROQ_API_KEY:}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.models.whisper=${GROQ_WHISPER_MODEL:whisper-large-v3-turbo}
groq.models.chat=${GROQ_CHAT_MODEL:openai/gpt-oss-120b}
groq.models.query-expansion=${GROQ_QUERY_EXPANSION_MODEL:openai/gpt-oss-20b}

# FFmpeg Executable Path
ffmpeg.path=${FFMPEG_PATH:ffmpeg}

# JWT Authentication (15-min access token, 7-day refresh token)
jwt.secret=${JWT_SECRET:adhyay_walchand_college_super_secure_jwt_secret_key_minimum_256_bits_length_123456}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# CORS Allowed Origins (* allows all origins via allowedOriginPatterns)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
