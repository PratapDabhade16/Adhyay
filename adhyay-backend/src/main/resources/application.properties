
spring.application.name=adhyay-backend

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/adhyay

# Server
server.port=8081

# Multipart upload limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Cloudinary credentials
# Supply these through environment variables.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
moodle.base-url=https://adhyay-lecture-management-system.moodlecloud.com
moodle.token=${MOODLE_TOKEN}
moodle.service=ADHYAY Integration