<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADHYAY | Campus overview</title>
  <link rel="stylesheet" href="adhyay.css">
  <style>
    .user-avatar-cell {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .user-cell-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #DDE3EA;
      color: #374151;
      font-weight: 700;
      font-size: 13px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-wrap">
        <div class="logo-mark">A</div>
        <span class="logo-name">ADHYAY</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" type="button">Overview</button>
      <button class="nav-item" type="button">Users</button>
      <button class="nav-item" type="button">Lectures</button>
    </nav>

    <div class="sidebar-user">
      <div class="sidebar-avatar">A</div>
      <div>
        <div class="sidebar-user-name">Admin name</div>
        <div class="sidebar-user-role">Administrator</div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <!-- Header -->
    <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;">
      <div>
        <h1 class="page-title">Campus overview</h1>
        <p class="page-subtitle">Everything happening across ADHYAY at a glance.</p>
      </div>
      <a class="btn-ghost" href="login.html">Log out</a>
    </div>

    <!-- 3 Stat cards -->
    <div class="stats-row" style="grid-template-columns:repeat(3, 1fr); margin-bottom: 28px;">
      <div class="stat-card">
        <div class="stat-label">Registered students</div>
        <div class="stat-value" id="studentCount">00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Faculty members</div>
        <div class="stat-value" id="facultyCount">00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Lectures in system</div>
        <div class="stat-value" id="totalLectures">00</div>
      </div>
    </div>

    <!-- User directory panel -->
    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap;">
        <h2 class="panel-title" style="margin:0;">User directory</h2>
        <div class="search-wrap" style="width:280px;">
          <input class="search-input" id="userSearch" type="search" placeholder="Search users" style="padding-left:14px;">
        </div>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th style="width:30%;">Name</th>
            <th style="width:35%;">Email</th>
            <th style="width:20%;">Role</th>
            <th style="width:15%;">Status</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="4" style="text-align:center;color:var(--muted);padding:36px;">
              Loading user directory...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<script src="admin-dashboard.js?v=2"></script>
</body>
</html>
